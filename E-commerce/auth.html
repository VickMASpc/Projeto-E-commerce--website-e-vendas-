<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesse sua conta - Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="auth">
  <div data-site-header></div>

  <main class="auth-page">
    <div class="auth-container">
      <div class="auth-card" id="login-card">
        <h1 class="auth-title">Bem-vindo de volta</h1>
        <p class="auth-subtitle">Acesse sua conta para gerenciar pedidos e favoritos.</p>
        
        <form class="auth-form" id="login-form">
          <div class="form-group">
            <label for="login-email">E-mail</label>
            <input type="email" id="login-email" required placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label for="login-password">Senha</label>
            <input type="password" id="login-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn-primary w-full">Entrar</button>
        </form>

        <div class="auth-divider"><span>ou</span></div>

        <button class="btn-outline w-full" id="btn-google-login">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18" height="18">
          Entrar com Google
        </button>

        <p class="auth-switch">
          Nao tem uma conta? <a href="#" id="show-register">Cadastre-se</a>
        </p>
      </div>

      <div class="auth-card" id="register-card" hidden>
        <h1 class="auth-title">Crie sua conta</h1>
        <p class="auth-subtitle">Junte-se a Grand Parfum para uma experiencia exclusiva.</p>
        
        <form class="auth-form" id="register-form">
          <div class="form-group">
            <label for="register-name">Nome completo</label>
            <input type="text" id="register-name" required placeholder="Seu Nome">
          </div>
          <div class="form-group">
            <label for="register-email">E-mail</label>
            <input type="email" id="register-email" required placeholder="seu@email.com">
          </div>
          <div class="form-group">
            <label for="register-password">Senha</label>
            <input type="password" id="register-password" required placeholder="Mínimo 6 caracteres">
          </div>
          <button type="submit" class="btn-primary w-full">Criar conta</button>
        </form>

        <p class="auth-switch">
          Ja tem uma conta? <a href="#" id="show-login">Faca login</a>
        </p>
      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
