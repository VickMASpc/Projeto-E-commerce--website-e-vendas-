<!doctype html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Produto — Grand Parfum</title><link rel='stylesheet' href='style.css'></head><body>
<nav class='navbar scrolled'><div class='navbar__inner'><a class='navbar__logo' href='index.html'>Grand<span>Parfum</span></a></div></nav>
<main class='section' style='padding-top:calc(var(--navbar-height) + 2rem)'><div class='section__container'><a href='produtos.html' class='btn-outline'>← Voltar</a><div id='product-view' style='margin-top:1.5rem'></div></div></main>
<script type='importmap'>{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"}}</script>
<script type='module' src='app.js'></script>
<script type='module'>
window.addEventListener('load', async ()=>{const id=new URLSearchParams(location.search).get('id'); await window.FirebaseDB?.initProducts('product-view'); const base=window.CURRENT_PRODUCTS||[]; const p=base.find(x=>x.id===id); const el=document.getElementById('product-view'); if(!p){el.innerHTML='<h1>Produto não encontrado</h1>';return;} const n=p.name||p.nome, d=p.description||p.descricao||'Sem descrição', price=parseFloat(p.price||p.preco||0), cat=p.category||p.categoria||'Perfume'; el.innerHTML=`<h1 class='section__title'>${n}</h1><p class='section__eyebrow'>${cat}</p><p style='margin:1rem 0;color:var(--clr-neutral-600)'>${d}</p><h2 style='margin:1rem 0'>R$ ${price.toLocaleString('pt-BR',{minimumFractionDigits:2})}</h2><button class='btn-primary' id='buy'>Adicionar ao carrinho</button>`; document.getElementById('buy').onclick=()=>window.Cart?.addItem(p.id,n,price,p.imageEmoji||'📦');});
</script></body></html>
