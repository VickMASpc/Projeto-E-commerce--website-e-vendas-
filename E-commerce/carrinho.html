<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carrinho Grand Parfum com resumo de pedido, dados de entrega e o mesmo layout base da home.">
  <title>Carrinho - Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <div data-site-header></div>

  <main class="page-main">
    <section class="page-hero">
      <div class="section__container">
        <div class="page-hero__copy">
          <div class="page-kicker">Resumo da compra</div>
          <h1 class="page-title">Checkout mais claro, sem pagina paralela.</h1>
          <p class="page-subtitle">Mesma identidade, mesmo header e um resumo de compra mais limpo para fechar o pedido com menos atrito.</p>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top: 1rem;">
      <div class="section__container">
        <div id="cart-content"></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="products_live.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
  <script type="module" src="commerce-enhancements.js"></script>
</body>
</html>
