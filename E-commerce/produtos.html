<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore nossa coleção completa de produtos — Grand Parfum.">
  <title>Produtos — Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .products-page { padding-top: calc(var(--navbar-height) + 3rem); }
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .filter-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .filter-btn {
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--clr-neutral-200);
      background: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .filter-btn:hover { border-color: var(--clr-primary-400); color: var(--clr-primary-600); }
    .filter-btn.active {
      background: var(--clr-primary-600);
      color: #fff;
      border-color: var(--clr-primary-600);
      box-shadow: 0 4px 12px rgba(112, 22, 232, 0.3);
    }
    .search-input-wrapper { position: relative; max-width: 300px; width: 100%; }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--clr-neutral-200);
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition-fast);
    }
    .search-input:focus { border-color: var(--clr-primary-400); }
    .search-icon { position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--clr-neutral-400); }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="navbar__inner">
      <a class="navbar__logo" href="index.html">Grand<span>Parfum</span></a>
      <ul class="navbar__links">
        <li><a class="navbar__link" href="index.html">Home</a></li>
        <li><a class="navbar__link active" href="produtos.html">Produtos</a></li>
        <li><a class="navbar__link" href="index.html#categorias">Categorias</a></li>
        <li><a class="navbar__link" href="index.html#sobre">Sobre</a></li>
      </ul>
      <div class="navbar__actions">
        <a href="carrinho.html" class="navbar__icon-btn" id="btn-cart">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="navbar__cart-badge" id="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <main class="products-page">
    <div class="section__container">
      <header class="section__header" style="text-align: left; margin-bottom: 2rem;">
        <span class="section__eyebrow">Catálogo Completo</span>
        <h1 class="section__title">Nossos Produtos</h1>
      </header>

      <div class="filter-bar">
        <div class="filter-group" id="category-filters">
          <button class="filter-btn active" data-category="all">Todos</button>
          <button class="filter-btn" data-category="Masculino">Masculino</button>
          <button class="filter-btn" data-category="Feminino">Feminino</button>
          <button class="filter-btn" data-category="Unissex">Unissex</button>
          <button class="filter-btn" data-category="Acessórios">Acessórios</button>
        </div>

        <div class="search-input-wrapper">
          <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="product-search" placeholder="Buscar produtos...">
        </div>
      </div>

      <div class="products__grid" id="all-products-grid">
        <!-- Populados dinamicamente -->
      </div>
    </div>
  </main>

  <footer class="footer" style="margin-top: 5rem;">
    <div class="footer__grid">
      <div>
        <div class="footer__brand-name">Grand<span>Parfum</span></div>
        <p class="footer__desc">Qualidade superior e entrega garantida para todo o Brasil.</p>
      </div>
      <div>
        <h3 class="footer__col-title">Links Úteis</h3>
        <ul class="footer__links">
          <li><a href="index.html" class="footer__link">Home</a></li>
          <li><a href="produtos.html" class="footer__link">Produtos</a></li>
          <li><a href="carrinho.html" class="footer__link">Carrinho</a></li>
        </ul>
      </div>
    </div>
  </footer>

  <!-- Firebase SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>

  <script src="products_live.js"></script>
  <script src="products.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module">
    // Disponibiliza funções do módulo no escopo global
    import firebaseConfig from "./firebase-config.js";
    
    document.addEventListener('DOMContentLoaded', () => {
      const grid = 'all-products-grid';
      const searchInput = document.getElementById('product-search');
      const filterBtns = document.querySelectorAll('.filter-btn');
      
      let currentCategory = 'all';
      let searchQuery = '';

      function updateDisplay() {
        const hasLive = (typeof PRODUCTS_LIVE !== 'undefined' && PRODUCTS_LIVE.length > 0);
        const baseProducts = hasLive ? PRODUCTS_LIVE : (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []);
        let filtered = baseProducts;
        
        if (currentCategory !== 'all') {
          filtered = filtered.filter(p => p.category === currentCategory);
        }
        
        if (searchQuery) {
          filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
            p.description.toLowerCase().includes(searchQuery.toLowerCase())
          );
        }
        
        renderProducts(grid, filtered);
      }

      // Filtros de Categoria
      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          updateDisplay();
        });
      });

      // Busca
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        updateDisplay();
      });

      // Inicial
      updateDisplay();

      // Checa se veio com filtro na URL
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get('cat');
      if (catParam) {
        const targetBtn = Array.from(filterBtns).find(b => b.dataset.category.toLowerCase() === catParam.toLowerCase());
        if (targetBtn) targetBtn.click();
      }
    });
  </script>
</body>
</html>
