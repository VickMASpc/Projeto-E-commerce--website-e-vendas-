<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogo Grand Parfum com filtros por categoria, ofertas, favoritos e busca em tempo real.">
  <title>Produtos - Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="products">
  <div data-site-header></div>

  <main class="page-main">
    <section class="page-hero">
      <div class="section__container">
        <div class="page-hero__content">
          <div class="page-hero__copy">
            <div class="page-kicker">Catalogo completo</div>
            <h1 class="page-title">Encontre o perfume certo sem atrito.</h1>
            <p class="page-subtitle">Filtre por categoria, navegue por ofertas e refine a busca com o mesmo motor usado no header ao vivo.</p>
          </div>
          <div class="toolbar__meta" id="products-count">0 produtos</div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top: 1rem;">
      <div class="section__container">
        <div class="toolbar">
          <div class="toolbar__row">
            <div class="toolbar__filters">
              <button class="filter-btn active" type="button" data-category-filter="all">Todos</button>
              <button class="filter-btn" type="button" data-category-filter="Masculino">Masculino</button>
              <button class="filter-btn" type="button" data-category-filter="Feminino">Feminino</button>
              <button class="filter-btn" type="button" data-category-filter="Unissex">Unissex</button>
              <button class="filter-btn" type="button" data-category-filter="Nicho">Nicho</button>
              <button class="filter-btn" type="button" data-category-filter="Acessorios">Acessorios</button>
            </div>
            <label class="toolbar__search" for="products-page-search">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input id="products-page-search" type="search" placeholder="Refinar busca na pagina...">
            </label>
          </div>

          <div class="toolbar__row">
            <div class="toolbar__filters">
              <button class="chip-btn active" type="button" data-product-filter="all">Tudo</button>
              <button class="chip-btn" type="button" data-product-filter="sale">Em oferta</button>
              <button class="chip-btn" type="button" data-product-filter="new">Novos</button>
              <button class="chip-btn" type="button" data-product-filter="wishlist">Favoritos</button>
            </div>
            <div class="toolbar__meta">Clique em qualquer card para abrir a pagina do produto.</div>
          </div>
        </div>

        <div class="products__grid" id="all-products-grid"></div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="products_live.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
