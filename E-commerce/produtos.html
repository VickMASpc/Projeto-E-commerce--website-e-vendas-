<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore nossa coleção completa de produtos — Grand Parfum.">
  <title>Produtos — Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>.products-page{padding-top:calc(var(--navbar-height) + 3rem)}.filter-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem;flex-wrap:wrap;gap:1.5rem}.filter-group{display:flex;gap:.75rem;flex-wrap:wrap}.filter-btn{padding:.6rem 1.25rem;border-radius:var(--radius-full);border:1px solid var(--clr-neutral-200);background:#fff;font-size:.875rem;font-weight:600;cursor:pointer}.filter-btn.active{background:var(--clr-primary-600);color:#fff;border-color:var(--clr-primary-600)}.search-input-wrapper{position:relative;max-width:340px;width:100%}.search-input{width:100%;padding:.75rem 1rem .75rem 2.5rem;border-radius:var(--radius-lg);border:1px solid var(--clr-neutral-200)}.search-icon{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:var(--clr-neutral-400)}</style>
</head>
<body>
<nav class="navbar scrolled" id="navbar"><div class="navbar__inner"><a class="navbar__logo" href="index.html">Grand<span>Parfum</span></a><ul class="navbar__links"><li><a class="navbar__link" href="index.html">Home</a></li><li><a class="navbar__link active" href="produtos.html">Produtos</a></li></ul><div class="navbar__actions"><a href="favoritos.html" class="navbar__icon-btn" aria-label="Lista de desejos">❤</a><a href="carrinho.html" class="navbar__icon-btn" id="btn-cart"><span class="navbar__cart-badge" id="cart-count">0</span>🛒</a></div></div></nav>
<main class="products-page"><div class="section__container"><header class="section__header" style="text-align:left"><h1 class="section__title">Nossos Produtos</h1></header><div class="filter-bar"><div class="filter-group" id="category-filters"><button class="filter-btn active" data-category="all">Todos</button><button class="filter-btn" data-category="Masculino">Masculino</button><button class="filter-btn" data-category="Feminino">Feminino</button><button class="filter-btn" data-category="Unissex">Unissex</button><button class="filter-btn" data-category="Acessórios">Acessórios</button></div><div class="search-input-wrapper"><svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input type="text" class="search-input" id="product-search" placeholder="Buscar produtos..."></div></div><div class="products__grid" id="all-products-grid"></div></div></main>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"}}</script>
<script type="module" src="app.js"></script>
<script type="module">
window.addEventListener('load', async () => {
  const grid='all-products-grid', searchInput=document.getElementById('product-search'), filterBtns=document.querySelectorAll('.filter-btn');
  let currentCategory='all', searchQuery='', currentFilter='';
  const params=new URLSearchParams(location.search);
  currentCategory=params.get('cat')||'all'; searchQuery=params.get('q')||''; currentFilter=params.get('filter')||'';
  searchInput.value=searchQuery;
  if(window.FirebaseDB) await window.FirebaseDB.initProducts(grid);
  const toBool=v=>v===true||String(v).toLowerCase()==='true'||v===1;
  const syncUrl=()=>{const p=new URLSearchParams(); if(currentCategory!=='all')p.set('cat',currentCategory); if(searchQuery)p.set('q',searchQuery); if(currentFilter)p.set('filter',currentFilter); history.replaceState({},'',`produtos.html${p.toString()?'?'+p.toString():''}`)};
  function updateDisplay(){
    const base=(window.CURRENT_PRODUCTS&&window.CURRENT_PRODUCTS.length)?window.CURRENT_PRODUCTS:((typeof PRODUCTS_LIVE!=='undefined')?PRODUCTS_LIVE:[]);
    let filtered=[...base];
    if(currentCategory.toLowerCase()==='promoções'){currentFilter='sale';currentCategory='all';}
    if(currentCategory!=='all') filtered=filtered.filter(p=>(p.category||p.categoria)===currentCategory);
    if(searchQuery) filtered=filtered.filter(p=>((p.name||p.nome||'')+' '+(p.description||p.descricao||'')).toLowerCase().includes(searchQuery.toLowerCase()));
    if(currentFilter==='sale') filtered=filtered.filter(p=>toBool(p.isSale||p.emOferta)||(p.oldPrice||p.precoAntigo));
    if(currentFilter==='new') filtered=filtered.filter(p=>toBool(p.isNew||p.eNovo));
    if(currentFilter==='wishlist') {const ids=(window.Wishlist?.getItems?.()||[]); filtered=filtered.filter(p=>ids.includes(p.id));}
    window.renderProducts?.(grid,filtered);
    syncUrl();
  }
  filterBtns.forEach(btn=>{if(btn.dataset.category.toLowerCase()===currentCategory.toLowerCase()) btn.classList.add('active'); else btn.classList.remove('active'); btn.onclick=()=>{filterBtns.forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentCategory=btn.dataset.category;updateDisplay();};});
  searchInput.addEventListener('input',(e)=>{searchQuery=e.target.value.trim();updateDisplay();});
  updateDisplay();
});
</script>
</body></html>
