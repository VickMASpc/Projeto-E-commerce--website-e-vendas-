<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catalogo Grand Parfum com perfumes originais, ofertas, favoritos e filtros por categoria.">
  <title>Produtos - Grand Parfum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="products">
  <div data-site-header></div>

  <main class="page-main">
    <section class="page-hero page-hero--catalog">
      <div class="section__container">
        <div class="page-breadcrumbs">
          <a href="index.html">Home</a>
          <span>/</span>
          <strong>Produtos</strong>
        </div>
        <div class="page-hero__content">
          <div class="page-hero__copy">
            <div class="page-kicker">Catalogo completo</div>
            <h1 class="page-title">Encontre o perfume ideal para o seu gosto.</h1>
            <p class="page-subtitle">Pesquise por marca, categoria ou notas e compare as opcoes da vitrine no seu ritmo.</p>
          </div>
          <div class="toolbar__meta toolbar__meta--count" id="products-count">0 produtos</div>
        </div>
      </div>
    </section>

    <section class="section section--compact">
      <div class="section__container catalog-layout">
        <aside class="catalog-sidebar">
          <div class="catalog-panel">
            <h2 class="catalog-panel__title">Categorias</h2>
            <div class="toolbar__filters toolbar__filters--stacked">
              <button class="filter-btn active" type="button" data-category-filter="all">Todos</button>
              <button class="filter-btn" type="button" data-category-filter="Masculino">Masculino</button>
              <button class="filter-btn" type="button" data-category-filter="Feminino">Feminino</button>
              <button class="filter-btn" type="button" data-category-filter="Unissex">Unissex</button>
              <button class="filter-btn" type="button" data-category-filter="Nicho">Nicho</button>
              <button class="filter-btn" type="button" data-category-filter="Acessorios">Acessorios</button>
            </div>
          </div>

          <div class="catalog-panel">
            <h2 class="catalog-panel__title">Filtros rapidos</h2>
            <div class="toolbar__filters toolbar__filters--stacked">
              <button class="chip-btn active" type="button" data-product-filter="all">Tudo</button>
              <button class="chip-btn" type="button" data-product-filter="sale">Em oferta</button>
              <button class="chip-btn" type="button" data-product-filter="new">Lancamentos</button>
              <button class="chip-btn" type="button" data-product-filter="wishlist">Favoritos</button>
            </div>
          </div>
        </aside>

        <div class="catalog-content">
          <div class="toolbar toolbar--catalog">
            <div class="toolbar__row toolbar__row--catalog">
              <label class="toolbar__search" for="products-page-search">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input id="products-page-search" type="search" placeholder="Buscar no catalogo...">
              </label>

              <label class="toolbar__sort" for="products-sort">
                <span>Ordenar por</span>
                <select id="products-sort">
                  <option value="featured">Destaques</option>
                  <option value="price-asc">Menor preco</option>
                  <option value="price-desc">Maior preco</option>
                  <option value="rating">Melhor avaliados</option>
                  <option value="newest">Lancamentos</option>
                </select>
              </label>
            </div>

            <div class="toolbar__row toolbar__row--catalog-meta">
              <div class="toolbar__meta" id="products-active-summary">Todos os perfumes disponiveis</div>
              <div class="toolbar__meta">Clique em qualquer card para abrir a pagina do produto.</div>
            </div>
          </div>

          <div class="products__grid" id="all-products-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="products_live.js"></script>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/functions": "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
